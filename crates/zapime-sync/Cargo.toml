[package]
name = "zapime-sync"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
zapime-data = { path = "../zapime-data" }
zapime-crypto = { path = "../zapime-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
