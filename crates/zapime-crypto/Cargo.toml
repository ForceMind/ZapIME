[package]
name = "zapime-crypto"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
zapime-data = { path = "../zapime-data" }
uuid = { version = "1", features = ["v4"] }
