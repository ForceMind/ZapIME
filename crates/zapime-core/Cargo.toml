[package]
name = "zapime-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
msime-engine = { path = "../../vendor/msime/crates/engine" }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
