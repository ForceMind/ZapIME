[package]
name = "zapime-data"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "functions", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
