name: Source Alpha release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Validate and prepare root source archive
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      plan_changed: ${{ steps.plan-change.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: source-alpha
      - name: Test source preparation and retry safety in real Git repositories
        run: python3 -m unittest discover -s scripts -p test_prepare_source_release.py -v
      - name: Verify pinned upstream and shared Rust workspace
        run: |
          python3 scripts/verify_upstream.py
          cargo +1.97.1 fmt --all --check
          cargo +1.97.1 test --workspace --locked
          cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings
      - name: Prepare exact committed source Alpha
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_RELEASE_DIR: ${{ runner.temp }}/zapime-source-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/prepare_source_release.py prepare --commit "$SOURCE_COMMIT" --output "$SOURCE_RELEASE_DIR"
      - name: Detect a committed release plan change
        id: plan-change
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE_COMMIT: ${{ github.event.before }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/prepare_source_release.py changed --before "$BEFORE_COMMIT" --commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: ZapIME-source-alpha-${{ github.sha }}
          path: ${{ runner.temp }}/zapime-source-release-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish source-only Alpha prerelease
    needs: prepare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ForceMind/ZapIME' && needs.prepare.outputs.plan_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: zapime-source-alpha-v0.1.0-alpha.1
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ZapIME-source-alpha-${{ github.sha }}
          path: ${{ runner.temp }}/zapime-source-release-${{ github.run_id }}-${{ github.run_attempt }}/
      - name: Verify tag, complete matching draft, and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RELEASE_DIR: ${{ runner.temp }}/zapime-source-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/prepare_source_release.py publish --commit "$SOURCE_COMMIT" --output "$SOURCE_RELEASE_DIR" --repository "$SOURCE_REPOSITORY"
