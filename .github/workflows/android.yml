name: Android native input acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    name: Android development APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-native
          cache-on-failure: true
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Voice dependency and model packaging boundaries
        run: python3 -m unittest discover -s scripts -p test_android_voice_tools.py -v
      - run: bash scripts/build_android.sh arm64-v8a
      - run: bash scripts/build_android.sh x86_64
      - run: bash scripts/build_android_tests.sh
      - run: bash scripts/build_android_voice_tests.sh
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare synthetic voice fixture Python runtime
        timeout-minutes: 5
        run: |
          python3 -m venv .venv-voice
          .venv-voice/bin/pip install --only-binary=:all: -r scripts/requirements-voice-fixture.txt
      - name: Prepare local synthetic speech tool
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends espeak-ng
      - name: Build checksum-verified offline import model
        timeout-minutes: 10
        run: python3 scripts/build_voice_model.py --output target/ZapIME-XASR-model.zip
      - name: Synthesize fixed Mandarin fixture
        run: |
          .venv-voice/bin/python scripts/voice_probe.py synthesize
      - name: Enable KVM for native input acceptance
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-zapime-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android API 28 native keyboard smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          emulator-boot-timeout: 300
          script: |
            adb install -r target/android-x86_64/ZapIME-0.1.0-dev-x86_64.apk
            python3 scripts/android_acceptance.py "$(command -v adb)" emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZapIME-Android-development
          path: |
            target/android-arm64-v8a/ZapIME-0.1.0-dev-arm64-v8a.apk
            target/android-x86_64/ZapIME-0.1.0-dev-x86_64.apk
            target/device-smoke/
            target/device-smoke-evidence/${{ github.run_id }}-${{ github.run_attempt }}/
            target/voice-android/
            target/android-voice-tests/ZapIME-voice-tests.apk
            target/android-tests/ZapIME-tests.apk
            target/voice-probe/synthetic.wav
            target/ZapIME-XASR-model.zip
          if-no-files-found: error
  modern:
    name: Android API ${{ matrix.api }} native acceptance
    needs: android
    # Keep collecting independent modern-system evidence if the API 28 input
    # gate failed after building complete artifacts. Either failure still makes
    # this workflow fail; an incomplete artifact fails the preflight explicitly.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: ZapIME-Android-development
          path: target
      - name: Verify exact development package inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from check_apk import check_contents
          for abi in ('arm64-v8a', 'x86_64'):
              check_contents(Path('target') / ('android-' + abi) / ('ZapIME-0.1.0-dev-' + abi + '.apk'))
          for path in ('target/android-tests/ZapIME-tests.apk', 'target/android-voice-tests/ZapIME-voice-tests.apk', 'target/voice-probe/synthetic.wav', 'target/ZapIME-XASR-model.zip'):
              assert Path(path).is_file() and Path(path).stat().st_size > 0, 'missing acceptance input: ' + path
          PY
      - name: Enable KVM on the dedicated modern emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-zapime-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual modern Android keyboard and offline voice
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          ram-size: '4096M'
          heap-size: '512M'
          emulator-boot-timeout: 300
          script: |
            adb install -r target/android-x86_64/ZapIME-0.1.0-dev-x86_64.apk
            python3 scripts/android_acceptance.py "$(command -v adb)" emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZapIME-Android-API-${{ matrix.api }}-acceptance
          path: |
            target/device-smoke/
            target/device-smoke-evidence/${{ github.run_id }}-${{ github.run_attempt }}/
            target/voice-android/
          if-no-files-found: warn
