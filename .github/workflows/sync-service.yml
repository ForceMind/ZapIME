name: Independent ciphertext sync service
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      server_preview:
        description: Build and retain native amd64 and arm64 server previews
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sync-service-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  postgres:
    name: ${{ matrix.architecture == 'amd64' && 'postgres' || 'postgres / arm64 preview' }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch'
            && inputs.server_preview
            && '[{"runner":"ubuntu-latest","architecture":"amd64","preview":true},{"runner":"ubuntu-24.04-arm","architecture":"arm64","preview":true}]'
            || '[{"runner":"ubuntu-latest","architecture":"amd64","preview":false}]') }}
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: zapime-ci-only
          POSTGRES_DB: zapime_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ZAPIME_TEST_DATABASE_URL: postgres://postgres:zapime-ci-only@localhost:5432/zapime_test?sslmode=disable
      ZAPIME_REQUIRE_DATABASE: '1'
      ZAPIME_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      ZAPIME_REQUIRE_S3: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/sync/go.mod
          cache-dependency-path: services/sync/go.sum
      - name: Start isolated S3-compatible storage for R2 protocol acceptance
        run: |
          docker build -t zapime-s3-fixture:ci scripts/fixtures/s3
          docker run -d --name zapime-object-test -p 127.0.0.1:9000:9000 -e MINIO_ROOT_USER=zapime-ci-key -e MINIO_ROOT_PASSWORD=zapime-ci-synthetic-secret zapime-s3-fixture:ci server /data
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: PostgreSQL transaction, HTTP, isolation and revoke tests
        run: |
          set -euo pipefail
          cd services/sync
          test -z "$(gofmt -l .)"
          go test -race -count=1 -v ./... | tee ../../sync-service-tests.log
          go vet ./...
      - name: Verify container build
        run: docker build -t zapime-sync:ci services/sync
      - name: Known Go vulnerability gate
        run: |
          cd services/sync
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/zapime-sync
      - name: Build real Rust encryption/recovery probe
        run: cargo build --locked -p zapime-crypto --example sync_fixture
      - name: Build shared manual client real-server acceptance probe
        run: cargo build --locked -p zapime-sync --example manual_sync_fixture
      - name: Two-device ciphertext and fresh-server recovery exercise
        run: python3 scripts/sync_service_smoke.py
      - name: One-command installer, repeat install and fresh DB + object bucket recovery
        if: ${{ !matrix.preview }}
        run: sudo --preserve-env=GITHUB_ACTIONS,GITHUB_SHA python3 scripts/server_install_smoke.py
      - name: Verify native installer and prepare approved preview
        if: ${{ matrix.preview }}
        env:
          PREVIEW_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          case "$PREVIEW_ARCHITECTURE:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) exit 1 ;;
          esac
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_ENVIRONMENT,RUNNER_TEMP \
            python3 scripts/server_install_smoke.py --save-preview
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.preview && success() }}
        with:
          name: ZapIME-server-preview-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/zapime-server-preview/zapime-server-preview-${{ matrix.architecture }}.tar.gz
            ${{ runner.temp }}/zapime-server-preview/preview.json
            ${{ runner.temp }}/zapime-server-preview/README.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.architecture == 'amd64' && 'ZapIME-sync-service-tests' || 'ZapIME-sync-service-tests-arm64' }}
          path: sync-service-tests.log
