name: Android isolated OIDC login and key recovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/a3-android-oidc.yml'
      - 'platforms/android/oidc-probe/**'
      - 'platforms/android/java/org/zapime/android/AccountLogin*.java'
      - 'platforms/android/java/org/zapime/android/AccountSyncActivity.java'
      - 'platforms/android/java/org/zapime/android/ForegroundSync.java'
      - 'platforms/android/java/org/zapime/android/SyncEnrollmentVault.java'
      - 'platforms/android/java/org/zapime/android/SyncEnrollmentRequest.java'
      - 'platforms/android/java/org/zapime/android/SyncConsentStore.java'
      - 'platforms/android/java/org/zapime/android/SyncConsentController.java'
      - 'platforms/android/java/org/zapime/android/SyncSecrets.java'
      - 'scripts/android_account_login_config.py'
      - 'scripts/android_a3_oidc.py'
      - 'scripts/android_a3_modern_oidc.py'
      - 'scripts/build_android_a3_source_fixture.sh'
      - 'platforms/android/java/org/zapime/android/SyncPreparation*.java'
      - 'scripts/run_android_a3_oidc_suite.sh'
      - 'scripts/fixtures/a3-oidc/**'
      - 'services/sync/internal/syncapi/automatic_enrollment*.go'
      - 'scripts/fixtures/sync_https_server.py'
      - 'scripts/test_sync_https_server.py'
      - 'crates/zapime-data/src/sync*.rs'
      - 'crates/zapime-sync/src/client.rs'
      - 'crates/zapime-sync/examples/manual_sync_fixture.rs'
permissions:
  contents: read
concurrency:
  group: a3-oidc-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  isolated-oidc:
    name: Android API ${{ matrix.api }} account acceptance
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35, 36]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 28
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zapime_a3_test
          POSTGRES_PASSWORD: zapime-a3-ci-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d zapime_a3_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ZAPIME_TEST_DATABASE_URL: postgres://postgres:zapime-a3-ci-only@localhost:5432/zapime_a3_test?sslmode=disable
      ZAPIME_REQUIRE_DATABASE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/sync/go.mod
          cache-dependency-path: services/sync/go.sum
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-linux-android
      - name: Verify shared automatic sync against real HTTPS and PostgreSQL
        run: |
          set -euo pipefail
          output="$PWD/target/a3-android-oidc"
          mkdir -p "$output"
          cargo build --locked -p zapime-sync --example manual_sync_fixture
          (cd services/sync && go build -mod=readonly -o "$output/sync-host-fixture" ./cmd/zapime-sync)
          ZAPIME_HTTPS_TEST_BINARY="$output/sync-host-fixture" \
            ZAPIME_HTTPS_TEST_DATABASE_URL="$ZAPIME_TEST_DATABASE_URL" \
            python3 scripts/test_sync_https_server.py RealHttpsFixtureTests.test_automatic_shortcut_real_https_and_no_echo
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install the pinned Android SDK and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Build native core and pinned dictionary for the foreground probe
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$ndk:$PATH"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$ndk/x86_64-linux-android28-clang"
          export CC_x86_64_linux_android="$CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER"
          python3 scripts/verify_upstream.py
          python3 scripts/fetch_resources.py
          cargo build --locked --release -p zapime-core --target x86_64-linux-android
          assets="$PWD/target/a3-android-oidc/main-source/assets"
          mkdir -p "$assets/dictionary" "$assets/licenses"
          cp target/resources/* "$assets/dictionary/"
          cp LICENSE "$assets/licenses/GPL-3.0.txt"
          cp third_party/licenses/* "$assets/licenses/"
          cp third_party/NOTICE.txt "$assets/NOTICE.txt"
          python3 scripts/collect_rust_notices.py x86_64-linux-android "$assets/rust-licenses"
      - name: Build the opt-in main app source for isolated API28
        if: matrix.api == 28
        run: |
          set -euo pipefail
          output="$PWD/target/a3-android-oidc/main-source"
          cat > "$output/public.json" <<'JSON'
          {"issuer":"https://a3-oidc.example.test","authorization":"https://a3-oidc.example.test/auth","token":"https://a3-oidc.example.test/token","callback":"https://return-a3.example.test/callback","resource":"https://a3-oidc.example.test/a3-device-enrollment","sync_server":"https://a3-oidc.example.test","client_id":"zapime-android-synthetic"}
          JSON
          bash scripts/build_android_a3_source_fixture.sh "$output" "$output/public.json"
          bash scripts/test_android_sync_http.sh
          bash scripts/test_android_sync_round.sh
      - name: Build signed test-only App Link probe
        if: matrix.api == 28
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          platform="$ANDROID_HOME/platforms/android-36/android.jar"
          output="$PWD/target/a3-android-oidc"
          mkdir -p "$output/classes" "$output/dex" "$output/issuer"
          javac -source 8 -target 8 -encoding UTF-8 -classpath "$platform" -d "$output/classes" platforms/android/oidc-probe/java/ProbeActivity.java
          jar cf "$output/classes.jar" -C "$output/classes" .
          "$tools/d8" --lib "$platform" --min-api 28 --output "$output/dex" "$output/classes.jar"
          "$tools/aapt2" link -o "$output/base.apk" --manifest platforms/android/oidc-probe/AndroidManifest.xml -I "$platform"
          zip -q -j "$output/base.apk" "$output/dex/classes.dex"
          "$tools/zipalign" -f 4 "$output/base.apk" "$output/aligned.apk"
          export ZAPIME_A3_TEST_SIGNING_PASS
          ZAPIME_A3_TEST_SIGNING_PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore "$output/oidc-test.jks" -storepass:env ZAPIME_A3_TEST_SIGNING_PASS -keypass:env ZAPIME_A3_TEST_SIGNING_PASS -alias oidc-probe -dname 'CN=ZapIME A3 CI test' -keyalg RSA -keysize 2048 -validity 2
          sign_fixture() {
            "$tools/apksigner" sign --ks "$output/oidc-test.jks" --ks-pass env:ZAPIME_A3_TEST_SIGNING_PASS \
              --key-pass env:ZAPIME_A3_TEST_SIGNING_PASS --out "$2" "$1"
            "$tools/apksigner" verify "$2"
          }
          sign_fixture "$output/aligned.apk" "$output/probe.apk"
          sign_fixture "$output/main-source/aligned.apk" "$output/main-source/fixture.apk"
      - name: Prepare locked Node issuer and Go verifier
        run: |
          set -euo pipefail
          output="$PWD/target/a3-android-oidc"
          (cd services/sync && go test -mod=readonly -c -o "$output/oidc-auth.test" ./internal/oidcauth)
          (cd services/sync && go test -mod=readonly -c -o "$output/oidc-account.test" ./internal/syncapi)
          cp scripts/fixtures/a3-oidc/{package.json,package-lock.json,issuer.mjs,android-issuer.mjs} "$output/issuer/"
          npm ci --prefix "$output/issuer" --ignore-scripts --no-audit --no-fund
      - name: Enable KVM on the fresh GitHub runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-zapime-a3-oidc-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify an actual API28 system App Link and OIDC browser return
        if: matrix.api == 28
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          avd-name: zapime-a3-oidc-${{ github.run_id }}-${{ github.run_attempt }}
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -wipe-data -no-snapshot -noaudio -no-boot-anim -writable-system
          emulator-boot-timeout: 300
          script: bash scripts/run_android_a3_oidc_suite.sh
      - name: Prepare pinned Cloudflare client for temporary test HTTPS
        if: matrix.api != 28
        run: |
          set -euo pipefail
          output="$PWD/target/a3-android-oidc/cloudflared"
          curl --fail --silent --show-error --location --retry 3 --max-time 90 https://github.com/cloudflare/cloudflared/releases/download/2026.10.6/cloudflared-linux-amd64 -o "$output"
          echo "1d356dac769d0dbf62ebe588c4034824bbff98d5790c2f844cc99e0e2f57462d  $output" | sha256sum --check
          chmod 700 "$output"
      - name: Verify stock App Links, browser login and system file selection
        if: matrix.api != 28
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          avd-name: zapime-a3-modern-${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -wipe-data -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 300
          script: python3 scripts/android_a3_modern_oidc.py ${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZapIME-API-${{ matrix.api }}-isolated-OIDC
          path: |
            target/a3-android-oidc/report.json
            target/a3-android-oidc/main-report.json
            target/a3-android-oidc/foreground-report.json
            target/a3-android-oidc/queue-window-report.json
            target/a3-android-oidc/archive-origin-report.json
            target/a3-android-oidc/automatic-report.json
            target/a3-android-oidc/automatic-recovery-report.json
            target/a3-android-oidc/modern-report.json
          if-no-files-found: error
