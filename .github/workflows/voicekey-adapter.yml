name: VoiceKey adapter (isolated)
on:
  pull_request:
    paths:
      - ".gitmodules"
      - "vendor/voicekey"
      - "integrations/voicekey/**"
      - ".github/workflows/voicekey-adapter.yml"
  push:
    branches: ["feat/voicekey-engine-import"]
    paths:
      - ".gitmodules"
      - "vendor/voicekey"
      - "integrations/voicekey/**"
      - ".github/workflows/voicekey-adapter.yml"
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Enforce offline-only VoiceKey dependency boundary
        run: |
          if grep -Eq 'voicekey-core|audiopus_sys|reqwest|tokio-tungstenite' integrations/voicekey/Cargo.toml; then
            echo "Unofficial cloud client dependency detected in offline adapter" >&2
            exit 1
          fi
      - name: Select pinned Rust compiler
        run: rustup toolchain install 1.97.1 --profile minimal && rustup component add rustfmt --toolchain 1.97.1
      - name: Format source (diagnostic until dependency build is verified)
        continue-on-error: true
        run: cargo +1.97.1 fmt --manifest-path integrations/voicekey/Cargo.toml --all -- --check
      - name: Build and unit test isolated VoiceKey adapter
        run: cargo +1.97.1 test --manifest-path integrations/voicekey/Cargo.toml
