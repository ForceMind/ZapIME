name: VoiceKey adapter (isolated)
on:
  pull_request:
    paths:
      - ".gitmodules"
      - "vendor/voicekey"
      - "integrations/voicekey/**"
      - ".github/workflows/voicekey-adapter.yml"
  push:
    branches: ["feat/voicekey-engine-import"]
    paths:
      - ".gitmodules"
      - "vendor/voicekey"
      - "integrations/voicekey/**"
      - ".github/workflows/voicekey-adapter.yml"
permissions:
  contents: read
jobs:
  adapter:
    name: Native numerical and lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Enforce offline-only VoiceKey dependency boundary
        run: |
          if grep -Eq 'voicekey-core|audiopus_sys|reqwest|tokio-tungstenite' integrations/voicekey/Cargo.toml; then
            echo "Unofficial cloud client dependency detected in offline adapter" >&2
            exit 1
          fi
      - name: Select pinned Rust compiler
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Identify actual runner architecture
        run: |
          uname -m
          rustc -vV
      - name: Strictly format all adapter-owned files without rewriting vendor
        run: |
          cargo fmt --manifest-path integrations/voicekey/Cargo.toml --all -- --check --config skip_children=true
          rustfmt --edition 2021 --check --config skip_children=true integrations/voicekey/src/*.rs
      - name: Build and unit test locked offline adapter
        run: cargo test --locked --manifest-path integrations/voicekey/Cargo.toml
      - name: Strictly lint adapter and probe
        run: cargo clippy --all-targets --locked --manifest-path integrations/voicekey/Cargo.toml -- -D warnings
      - name: Verify locked dependency graph
        run: cargo tree --locked --manifest-path integrations/voicekey/Cargo.toml --edges normal
      - name: Release kernel timing diagnostic (not handset latency)
        run: cargo test --release --locked --manifest-path integrations/voicekey/Cargo.toml architecture_dot_timing_diagnostic -- --nocapture --test-threads=1
