name: ZapIME development checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    name: Shared core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - run: python scripts/verify_upstream.py
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: iOS simulator shared library check (not native keyboard acceptance)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-ios-sim
          SDKROOT=$(xcrun --sdk iphonesimulator --show-sdk-path) cargo check --locked -p zapime-core --target aarch64-apple-ios-sim
  android:
    name: Android development APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - run: bash scripts/build_android.sh arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: ZapIME-Android-development
          path: target/android-arm64-v8a/ZapIME-0.1.0-dev-arm64-v8a.apk
          if-no-files-found: error
