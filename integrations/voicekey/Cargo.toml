[package]
name = "zapime-voicekey-adapter"
version = "0.1.0"
edition = "2021"
publish = false
description = "Optional offline VoiceKey wtlocal recognition for ZapIME"

[lib]
crate-type = ["rlib", "cdylib"]

# This adapter only compiles VoiceKey's offline wtlocal Rust modules. The
# complete upstream source is pinned separately; none of its unofficial
# cloud protocol modules, credentials or audio device wrappers link here.
[workspace]
resolver = "2"

[dependencies]
anyhow = "1"
async-trait = "0.1"
memmap2 = "0.9"
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
serde_json = "1"
