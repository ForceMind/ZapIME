name: ZapIME
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/ZapIME-Bridging.h
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../target/apple-ios/lib
    OTHER_LDFLAGS: ['$(inherited)', '-lzapime_core', '-lc++', '-liconv']
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ZapIME:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: ../../target/apple-ios/EngineResources
        type: folder
        buildPhase: resources
      - path: ../../target/apple-ios/Licenses
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.zapime.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 闪电输入法
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
    dependencies:
      - target: ZapIMEKeyboard
        embed: true
  ZapIMEKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
      - path: ../../target/apple-ios/EngineResources
        type: folder
        buildPhase: resources
      - path: ../../target/apple-ios/Licenses
        type: folder
        buildPhase: resources
    info:
      path: ../../target/apple-ios/Keyboard-Info.plist
      properties:
        CFBundleDisplayName: 闪电输入法
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: '1'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrimaryLanguage: zh-Hans
            PrefersRightToLeft: false
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.zapime.ios.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
  ZapIMETests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ZapIME
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.zapime.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ZapIME.app/ZapIME
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  ZapIME:
    build:
      targets:
        ZapIME: all
        ZapIMETests: [test]
    test:
      targets: [ZapIMETests]
