services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: zapime
      POSTGRES_DB: zapime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
    volumes: [zapime-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U zapime -d zapime]
      interval: 5s
      timeout: 3s
      retries: 20
    labels: {io.zapime.installation: "${ZAPIME_INSTALLATION_ID:-manual}"}
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: unless-stopped
  sync:
    build: .
    environment:
      DATABASE_URL: postgres://zapime@db:5432/zapime?sslmode=disable
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
      ZAPIME_LISTEN: 0.0.0.0:8787
      ZAPIME_OBJECT_BACKEND: ${ZAPIME_OBJECT_BACKEND:-postgres}
      ZAPIME_S3_ENDPOINT: ${ZAPIME_S3_ENDPOINT:-}
      ZAPIME_S3_BUCKET: ${ZAPIME_S3_BUCKET:-}
      ZAPIME_S3_ACCESS_KEY_ID: ${ZAPIME_S3_ACCESS_KEY_ID:-}
      ZAPIME_S3_SECRET_ACCESS_KEY: ${ZAPIME_S3_SECRET_ACCESS_KEY:-}
      ZAPIME_S3_REGION: ${ZAPIME_S3_REGION:-auto}
      ZAPIME_S3_ALLOW_HTTP: ${ZAPIME_S3_ALLOW_HTTP:-0}
      GOMEMLIMIT: 192MiB
    ports: ['127.0.0.1:8787:8787']
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    labels: {io.zapime.installation: "${ZAPIME_INSTALLATION_ID:-manual}"}
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: unless-stopped
  https:
    image: caddy:2
    profiles: [https]
    ports: ['80:80', '443:443']
    environment:
      ZAPIME_HOST: ${ZAPIME_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - zapime-caddy:/data
    depends_on: [sync]
    labels: {io.zapime.installation: "${ZAPIME_INSTALLATION_ID:-manual}"}
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    restart: unless-stopped
volumes:
  zapime-db:
    labels: {io.zapime.installation: "${ZAPIME_INSTALLATION_ID:-manual}"}
  zapime-caddy:
    labels: {io.zapime.installation: "${ZAPIME_INSTALLATION_ID:-manual}"}
